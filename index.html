<!DOCTYPE html> <!--
descreve a linguagem de programação que esta sendo utilizada, nesse caso é o HTML-->
<html lang="pt-br"> <!--início do documento-->
<head> <!--define o cabeçalho do documento. O conteúdo descrito aqui não aparece no navegador. Essa tag serve para inserir folhas de estilo e script-->
    <meta charset="UTF-8"> <!--indica qual serão os caracteres (character set ou charset) será utilizado parar renderizar o texto da página-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> <!--é o espaço em que todas as tags devem ser colocadas. O conteúdo aqui contido é o visual da página. As tags que representam texto, botões e outros devem ser adicionados nesse intervalo.-->
    
</body>
</html> <!--fim do documento-->!
